<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Leaderboard & Stage Display — PechaKucha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,900;1,9..144,400&family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<!-- GSAP for UI Animation -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<!-- Canvas Confetti Physics Engine -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
<style>
/* ═══════════════════════════════════════════════════
   GLASSMORPHISM DESIGN SYSTEM
   ═══════════════════════════════════════════════════ */
:root {
  --text: #ffffff; --text-dim: #b8b2c6; --text-faint: #746d88;
  --gold: #fce373; --gold-dim: #cba83b;
  --silver: #dbe4ee; --bronze: #e09653;
  --accent: #ff4d4d; --accent-glow: rgba(255,77,77,0.5);
  --amber: #ffaa00; --amber-glow: rgba(255,170,0,0.4);
  --bar-fill: linear-gradient(90deg, #1aa3ff, #ff4d4d, #fce373);
  --bar-fill-leader: linear-gradient(90deg, #fce373, #ffeba3, #fff);
  
  /* Glass Variables */
  --glass-bg: rgba(255, 255, 255, 0.03);
  --glass-border: rgba(255, 255, 255, 0.08);
  --glass-border-light: rgba(255, 255, 255, 0.15);
}

*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background-color: #030105; /* Deep space black */
  color: var(--text);
  font-family: 'IBM Plex Sans', sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* ═══════════════ CINEMATIC CODE BACKGROUND ═══════════════ */
/* 100% CSS. Infinite Resolution. Zero Pixelation. */
.cinematic-bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }

.cinema-orb {
  position: absolute; border-radius: 50%;
  filter: blur(100px); opacity: 0.6; mix-blend-mode: screen;
  animation: drift 25s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
  will-change: transform;
}
.orb-teal {
  width: 80vw; height: 80vw;
  background: radial-gradient(circle, rgba(26,163,255,0.45) 0%, transparent 60%);
  top: -30%; left: -20%;
}
.orb-orange {
  width: 70vw; height: 70vw;
  background: radial-gradient(circle, rgba(255,100,50,0.35) 0%, transparent 60%);
  bottom: -30%; right: -20%;
  animation-delay: -7s;
}
.orb-copper {
  width: 60vw; height: 60vw;
  background: radial-gradient(circle, rgba(252,227,115,0.25) 0%, transparent 60%);
  top: 20%; left: 30%;
  animation-delay: -14s;
}
.cinema-noise {
  position: absolute; inset: 0; opacity: 0.08; mix-blend-mode: overlay; pointer-events: none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
}
@keyframes drift {
  0% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(8%, 12%) scale(1.1); }
  100% { transform: translate(-5%, 8%) scale(0.9); }
}

/* Custom Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

/* ═══════════════ LAYOUT ═══════════════ */
.app { position: relative; z-index: 2; display: flex; flex-direction: column; height: 100vh; }

/* ═══════════════ HEADER ═══════════════ */
.header { display: flex; align-items: center; justify-content: space-between; padding: 30px 50px; flex-shrink: 0; }
.header-left { display: flex; align-items: center; gap: 24px; }
.live-badge {
  display: inline-flex; align-items: center; gap: 10px;
  background: var(--accent); padding: 8px 20px; border-radius: 100px;
  font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 700; letter-spacing: 0.1em;
  color: #fff; animation: livePulse 2s ease-in-out infinite; box-shadow: 0 0 20px var(--accent-glow);
}
.live-badge .dot { width: 10px; height: 10px; background: #fff; border-radius: 50%; animation: dotPulse 1.2s ease-in-out infinite; }
.live-badge.closed { background: rgba(255,255,255,0.1); animation: none; box-shadow: none; color: var(--text-dim); }
.live-badge.closed .dot { animation: none; opacity: 0.4; }
@keyframes livePulse { 0%,100% { box-shadow: 0 0 10px var(--accent-glow); } 50% { box-shadow: 0 0 25px 8px var(--accent-glow); } }
@keyframes dotPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

.header-title { font-family: 'Fraunces', serif; font-size: 2rem; font-weight: 600; text-shadow: 0 4px 20px rgba(0,0,0,0.5); }
.header-title .accent { background: linear-gradient(135deg, var(--gold), #fff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.header-right { display: flex; align-items: center; gap: 20px; }

.stat-pill {
  background: var(--glass-bg); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  border: 1px solid var(--glass-border); border-top: 1px solid var(--glass-border-light);
  border-radius: 100px; padding: 12px 30px; display: flex; align-items: center; gap: 16px;
  box-shadow: 0 8px 32px 0 rgba(0,0,0,0.3);
}
.stat-pill .num { font-family: 'IBM Plex Mono', monospace; font-size: 2rem; font-weight: 700; color: var(--gold); text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
.stat-pill .label { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.7); }

/* ═══════════════ MAIN CONTENT AREA ═══════════════ */
#resultsBoard { display: none; flex: 1; padding: 10px 50px 30px; overflow: hidden; }
.main-content { display: flex; gap: 50px; height: 100%; max-width: 1500px; margin: 0 auto; align-items: center; }
.leaderboard-area { flex: 1; position: relative; height: 100%; display: flex; align-items: center; }
.leaderboard { position: relative; width: 100%; height: 500px; } 

/* ═══════════════ COUNTDOWN PANEL ═══════════════ */
.countdown-panel {
  width: 320px; flex-shrink: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px;
  background: linear-gradient(145deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01));
  backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
  border: 1px solid var(--glass-border); border-top: 1px solid rgba(255,255,255,0.2);
  border-radius: 32px; padding: 50px 30px;
  box-shadow: 0 30px 60px rgba(0,0,0,0.4), inset 0 0 0 1px rgba(255,255,255,0.05);
}
.countdown-ring-wrap { position: relative; width: 240px; height: 240px; }
.countdown-svg { width: 240px; height: 240px; transform: rotate(-90deg); filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5)); }
.countdown-track { fill: none; stroke: rgba(255,255,255,0.05); stroke-width: 4; }
.countdown-progress { fill: none; stroke: var(--gold); stroke-width: 8; stroke-linecap: round; transition: stroke 0.5s; }
.countdown-progress.amber { stroke: var(--amber); }
.countdown-progress.red { stroke: var(--accent); }
.countdown-progress.red-pulse { stroke: var(--accent); animation: ringPulse 0.6s ease-in-out infinite; }
.countdown-time {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  font-family: 'IBM Plex Mono', monospace; font-size: 3.8rem;
  font-weight: 700; color: var(--text); letter-spacing: 0.02em;
  text-shadow: 0 4px 15px rgba(0,0,0,0.5); transition: color 0.5s, font-size 0.3s;
}
.countdown-time.amber { color: var(--amber); }
.countdown-time.red { color: var(--accent); }
.countdown-time.final { font-size: 5.5rem; color: var(--accent); }
.countdown-label { font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-dim); }
.countdown-label.urgent { color: var(--accent); animation: labelBlink 0.8s ease-in-out infinite; text-shadow: 0 0 10px var(--accent-glow); }
.countdown-waiting { font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: var(--text-faint); text-align: center; line-height: 1.6; }

/* ═══════════════ BAR ROW (Glass Pills) ═══════════════ */
.bar-row {
  position: absolute; left: 0; right: 0;
  display: flex; align-items: center; gap: 20px;
  height: 80px; padding: 0 20px 0 10px; border-radius: 100px;
  background: linear-gradient(90deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--glass-border); border-top: 1px solid var(--glass-border-light);
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  transition: border-color 0.4s, background 0.4s, box-shadow 0.4s;
  will-change: top, transform;
}

/* 🌟 SPOTLIGHT LAYER 🌟 */
.spotlight-layer {
  position: absolute; inset: 0; border-radius: 100px; overflow: hidden; pointer-events: none; z-index: 0;
}
.bar-row.is-leader-row .spotlight-layer::before {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(110deg, transparent 20%, rgba(255,255,255,0.1) 40%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0.1) 60%, transparent 80%);
  width: 200%; height: 100%; top: 0; left: -100%;
  animation: sweepSpotlight 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
  mix-blend-mode: overlay;
}
@keyframes sweepSpotlight {
  0% { transform: translateX(-20%); }
  100% { transform: translateX(120%); }
}

/* King of the Hill Pop-out */
.bar-row.is-leader-row {
  background: linear-gradient(90deg, rgba(252, 227, 115, 0.15), rgba(255,255,255,0.02));
  border-color: rgba(252, 227, 115, 0.5); border-top: 1px solid rgba(252, 227, 115, 0.7);
  box-shadow: 0 20px 50px rgba(0,0,0,0.6), 0 0 40px rgba(252, 227, 115, 0.2);
  z-index: 10;
}

/* Ensure content stays above spotlight */
.bar-row > * { position: relative; z-index: 1; }

.rank-badge {
  width: 54px; height: 54px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; border-radius: 50%;
  font-family: 'Fraunces', serif; font-size: 1.5rem; font-weight: 900;
  color: var(--text); background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1); box-shadow: inset 0 2px 10px rgba(255,255,255,0.05);
  transition: background 0.6s, transform 0.4s, color 0.4s, border-color 0.4s;
}
.bar-row[data-rank="1"] .rank-badge {
  background: linear-gradient(135deg, var(--gold), #fff); color: #000;
  border-color: var(--gold); box-shadow: 0 0 20px rgba(252, 227, 115, 0.4); transform: scale(1.1);
}
.bar-row[data-rank="2"] .rank-badge { background: linear-gradient(135deg, var(--silver), #fff); color: #000; }
.bar-row[data-rank="3"] .rank-badge { background: linear-gradient(135deg, var(--bronze), #ffcaa3); color: #000; }

.participant-photo {
  width: 56px; height: 56px; flex-shrink: 0; border-radius: 50%; object-fit: cover;
  border: 2px solid rgba(255,255,255,0.15); box-shadow: 0 4px 15px rgba(0,0,0,0.5); transition: border-color 0.4s;
}
.bar-row[data-rank="1"] .participant-photo { border-color: var(--gold); box-shadow: 0 0 15px rgba(252, 227, 115, 0.4); }

.participant-name {
  width: 200px; flex-shrink: 0; font-family: 'Fraunces', serif; font-size: 1.3rem;
  font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  text-shadow: 0 2px 5px rgba(0,0,0,0.5); transition: color 0.4s;
}
.bar-row[data-rank="1"] .participant-name { color: var(--gold); text-shadow: 0 2px 10px rgba(0,0,0,0.8); }

.bar-track {
  flex: 1; height: 24px; background: rgba(0,0,0,0.5);
  border: 1px solid rgba(255,255,255,0.05); border-radius: 100px;
  overflow: hidden; position: relative; box-shadow: inset 0 2px 8px rgba(0,0,0,0.8);
}
.bar-fill {
  height: 100%; width: 0%; background: var(--bar-fill); border-radius: 100px; position: relative;
  box-shadow: 0 0 15px rgba(26,163,255,0.4);
}
.bar-row[data-rank="1"] .bar-fill {
  background: var(--bar-fill-leader); box-shadow: 0 0 20px rgba(252, 227, 115, 0.5);
}
.bar-row[data-rank="1"] .bar-fill::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.5) 50%, transparent 100%);
  animation: shimmer 2s ease-in-out infinite;
}
@keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

.vote-count {
  width: 90px; flex-shrink: 0; text-align: right;
  font-family: 'IBM Plex Mono', monospace; font-size: 2.2rem; font-weight: 700;
  text-shadow: 0 4px 10px rgba(0,0,0,0.8); transition: color 0.4s;
}
.bar-row[data-rank="1"] .vote-count { color: var(--gold); }
.vote-pct {
  width: 65px; flex-shrink: 0; text-align: right;
  font-family: 'IBM Plex Mono', monospace; font-size: 1rem; color: rgba(255,255,255,0.6);
}

/* ═══════════════ WINNER OVERLAY (Cinematic Heavy Blur) ═══════════════ */
.winner-overlay {
  position: fixed; inset: 0; z-index: 500;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: rgba(5, 3, 10, 0.6); 
  backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px); 
  opacity: 0; pointer-events: none; transition: opacity 1s;
}
.winner-overlay.active { pointer-events: auto; }
.winner-content { position: relative; z-index: 10; text-align: center; } /* Above confetti */
.winner-suspense { font-family: 'Fraunces', serif; font-style: italic; font-size: 2.5rem; color: var(--text-dim); opacity: 0; text-shadow: 0 4px 20px rgba(0,0,0,0.8); }

.winner-profiles { display: flex; justify-content: center; gap: 60px; margin-top: 30px; opacity: 0; flex-wrap: wrap; }
.winner-profile { display: flex; flex-direction: column; align-items: center; }
.winner-photo-wrap {
  width: 250px; height: 250px; margin: 0 auto; border-radius: 50%; overflow: hidden;
  border: 4px solid var(--gold); box-shadow: 0 0 60px rgba(252,227,115,0.4), inset 0 0 20px rgba(0,0,0,0.5);
}
.winner-photo-wrap img { width: 100%; height: 100%; object-fit: cover; }
.winner-name {
  font-family: 'Fraunces', serif; font-size: 4.5rem; font-weight: 900;
  margin-top: 24px; line-height: 1.1;
  background: linear-gradient(135deg, var(--gold), #fff, var(--gold));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  filter: drop-shadow(0 10px 20px rgba(0,0,0,0.8));
}
.winner-stats { display: flex; gap: 50px; justify-content: center; margin-top: 30px; opacity: 0; }
.winner-stat { text-align: center; }
.winner-stat .num { font-family: 'IBM Plex Mono', monospace; font-size: 3rem; font-weight: 700; color: var(--gold); text-shadow: 0 4px 20px rgba(252,227,115,0.3); }
.winner-stat .label { font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,0.8); margin-top: 4px; }
.winner-badge {
  display: inline-block; margin-top: 30px; padding: 12px 36px;
  background: rgba(252,227,115,0.1); backdrop-filter: blur(10px);
  border: 1px solid rgba(252,227,115,0.4); border-radius: 100px;
  font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 700;
  letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); opacity: 0;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

/* ═══════════════ FINAL STANDINGS CORNER BOARD (Glass) ═══════════════ */
.mini-scoreboard {
  position: absolute; bottom: 50px; right: 50px; z-index: 10;
  background: linear-gradient(145deg, rgba(255,255,255,0.1), rgba(255,255,255,0.02));
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  border: 1px solid var(--glass-border); border-top: 1px solid rgba(255,255,255,0.2);
  border-radius: 24px; padding: 28px; width: 360px; opacity: 0;
  box-shadow: 0 30px 60px rgba(0,0,0,0.8), inset 0 0 0 1px rgba(255,255,255,0.05);
  max-height: calc(100vh - 100px); overflow-y: auto;
}
.mini-header {
  font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 700;
  letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.6);
  margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid rgba(255,255,255,0.1);
}
.mini-row { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
.mini-row:last-child { margin-bottom: 0; }
.mini-rank { font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 700; width: 28px; color: rgba(255,255,255,0.5); text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
.mini-row[data-rank="1"] .mini-rank { color: var(--gold); }
.mini-row[data-rank="2"] .mini-rank { color: var(--silver); }
.mini-row[data-rank="3"] .mini-rank { color: var(--bronze); }
.mini-photo { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 1px solid rgba(255,255,255,0.2); }
.mini-row[data-rank="1"] .mini-photo { border-color: var(--gold); }
.mini-name { flex: 1; font-family: 'IBM Plex Sans', sans-serif; font-size: 1.05rem; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
.mini-row[data-rank="1"] .mini-name { color: var(--gold); }
.mini-score { font-family: 'IBM Plex Mono', monospace; font-size: 1.2rem; font-weight: 700; color: var(--text); text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
.mini-row[data-rank="1"] .mini-score { color: var(--gold); }

/* ═══════════════ ADMIN ═══════════════ */
.auth-guard { flex: 1; display: flex; align-items: center; justify-content: center; }
.btn-admin { background: linear-gradient(135deg, var(--gold-dim), var(--gold)); color: #000; border: none; padding: 18px 44px; font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; border-radius: 100px; cursor: pointer; transition: transform 0.2s, box-shadow 0.3s; }
.btn-admin:hover { transform: translateY(-3px); box-shadow: 0 16px 40px rgba(252,227,115,0.3); }
.admin-controls { position: fixed; bottom: 30px; right: 30px; z-index: 150; display: flex; gap: 12px; }
.btn-ctrl { padding: 14px 28px; border-radius: 100px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; cursor: pointer; border: none; transition: transform 0.2s, opacity 0.2s; box-shadow: 0 8px 20px rgba(0,0,0,0.6); }
.btn-ctrl:hover { transform: translateY(-2px); }
.btn-ctrl:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
.btn-start { background: var(--gold); color: #000; }
.btn-reset { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); color: var(--text); border: 1px solid rgba(255,255,255,0.2); }
</style>
</head>
<body>

<!-- CINEMATIC CODE BACKGROUND -->
<div class="cinematic-bg">
  <div class="cinema-orb orb-teal"></div>
  <div class="cinema-orb orb-orange"></div>
  <div class="cinema-orb orb-copper"></div>
  <div class="cinema-noise"></div>
</div>

<div class="app">
  <header class="header">
    <div class="header-left">
      <div class="live-badge" id="liveBadge"><span class="dot"></span> LIVE</div>
      <div class="header-title">Pecha<span class="accent">Kucha</span> 2026</div>
    </div>
    <div class="header-right">
      <div class="stat-pill"><div class="num" id="totalVotes">0</div><div class="label">Total Votes</div></div>
      <div class="stat-pill"><div class="num" id="leadMargin">—</div><div class="label">Lead Margin</div></div>
    </div>
  </header>

  <div class="auth-guard" id="authGuard">
    <button class="btn-admin" id="loginBtn">Sign in as Admin</button>
  </div>

  <div id="resultsBoard">
    <div class="main-content">
      <div class="leaderboard-area"><div class="leaderboard" id="leaderboard"></div></div>
      <div class="countdown-panel" id="countdownPanel">
        <div class="countdown-ring-wrap">
          <svg class="countdown-svg" viewBox="0 0 220 220">
            <circle class="countdown-track" cx="110" cy="110" r="100"/>
            <circle class="countdown-progress" id="countdownRing" cx="110" cy="110" r="100" stroke-dasharray="628.32" stroke-dashoffset="0"/>
          </svg>
          <div class="countdown-time" id="countdownTime">3:00</div>
        </div>
        <div class="countdown-label" id="countdownLabel">Voting Countdown</div>
        <p class="countdown-waiting" id="countdownWaiting">Waiting for admin<br>to start countdown</p>
      </div>
    </div>
  </div>

  <div class="admin-controls" id="adminControls" style="display: none;">
    <button class="btn-ctrl btn-start" id="btnStart">▶ Start 3:00 Countdown</button>
    <button class="btn-ctrl btn-reset" id="btnReset" disabled>↻ Reset</button>
  </div>
</div>

<!-- WINNER OVERLAY -->
<div class="winner-overlay" id="winnerOverlay">
  <div class="winner-content">
    <div class="winner-suspense" id="winnerSuspense">And the winner is...</div>
    <div class="winner-profiles" id="winnerProfiles"></div>
    <div class="winner-stats" id="winnerStats">
      <div class="winner-stat"><div class="num" id="winnerVotes">0</div><div class="label">Votes Each</div></div>
      <div class="winner-stat"><div class="num" id="winnerPct">0%</div><div class="label">Of Total</div></div>
    </div>
    <div class="winner-badge" id="winnerBadge">🏆 PechaKucha 2026 Champion</div>
  </div>
  <div class="mini-scoreboard" id="miniScoreboard"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

/* FIREBASE CONFIG & LINEUP */
import { firebaseConfig, ADMIN_EMAIL } from "./firebase-config.js";
import { participants } from "./participants.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

// Check for default config
if (firebaseConfig.apiKey.includes("YOUR_API_KEY")) {
  const banner = document.createElement("div");
  banner.style.cssText = "position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#c9573f;color:#fff;padding:12px 24px;border-radius:8px;font-size:13px;font-family:monospace;z-index:9999;box-shadow:0 10px 30px rgba(0,0,0,0.5);text-align:center;max-width:90vw;";
  banner.innerHTML = "⚙️ <strong>Setup Required:</strong> Please configure your Firebase credentials in <code>firebase-config.js</code> to enable live sync.";
  document.body.appendChild(banner);
}

/* BUILD LEADERBOARD */
const leaderboard = document.getElementById('leaderboard');
const ROW_HEIGHT = 100;

participants.forEach((p, i) => {
  const row = document.createElement('div');
  row.className = 'bar-row'; row.id = `row-${p.id}`; row.dataset.rank = i + 1;
  row.style.top = (i * ROW_HEIGHT) + 'px'; row.style.opacity = '0';
  row.innerHTML = `
    <div class="spotlight-layer"></div>
    <div class="rank-badge" id="rank-${p.id}">${i + 1}</div>
    <img class="participant-photo" src="${p.image}" alt="${p.name}">
    <div class="participant-name">${p.name}</div>
    <div class="bar-track"><div class="bar-fill" id="fill-${p.id}"></div></div>
    <div class="vote-count" id="count-${p.id}">0</div>
    <div class="vote-pct" id="pct-${p.id}">0%</div>
  `;
  leaderboard.appendChild(row);
});

/* HELPERS */
function animateCount(el, target) {
  const current = parseInt(el.textContent) || 0;
  if (current === target) return;
  const obj = { val: current };
  gsap.to(obj, { val: target, duration: 0.8, ease: "power2.out", onUpdate: () => { el.textContent = Math.round(obj.val); } });
}

/* COUNTDOWN TIMER */
const COUNTDOWN_DURATION = 180;
const CIRCUMFERENCE = 2 * Math.PI * 100;
const countdownRing = document.getElementById('countdownRing');
const countdownTime = document.getElementById('countdownTime');
const countdownLabel = document.getElementById('countdownLabel');
const countdownWaiting = document.getElementById('countdownWaiting');
const btnStart = document.getElementById('btnStart');
const btnReset = document.getElementById('btnReset');
const liveBadge = document.getElementById('liveBadge');

countdownRing.style.strokeDasharray = CIRCUMFERENCE;
countdownRing.style.strokeDashoffset = '0';

let countdownInterval = null;
let remainingSeconds = COUNTDOWN_DURATION;
let countdownActive = false;
let votingLocked = false;
let latestCounts = {};
let latestTotalVotes = 0;

function formatTime(s) {
  const m = Math.floor(s / 60); const sec = s % 60; return `${m}:${sec.toString().padStart(2, '0')}`;
}

function updateCountdownDisplay() {
  countdownTime.textContent = formatTime(remainingSeconds);
  const fraction = remainingSeconds / COUNTDOWN_DURATION;
  countdownRing.style.strokeDashoffset = CIRCUMFERENCE * (1 - fraction);
  countdownRing.classList.remove('amber', 'red', 'red-pulse');
  countdownTime.classList.remove('amber', 'red', 'final');
  countdownLabel.classList.remove('urgent');

  if (remainingSeconds <= 15) {
    countdownRing.classList.add('red-pulse'); countdownTime.classList.add('red');
    countdownLabel.textContent = 'HURRY UP!'; countdownLabel.classList.add('urgent');
    if (remainingSeconds <= 5) countdownTime.classList.add('final');
  } else if (remainingSeconds <= 60) {
    countdownRing.classList.add('amber'); countdownTime.classList.add('amber');
    countdownLabel.textContent = 'Time Running Out';
  } else {
    countdownLabel.textContent = 'Voting Countdown';
  }
}

function startCountdown() {
  if (countdownActive) return;
  countdownActive = true; countdownWaiting.style.display = 'none';
  btnStart.disabled = true; btnReset.disabled = true;
  setDoc(doc(db, "config", "voting"), { open: true, startedAt: new Date() });

  countdownInterval = setInterval(() => {
    remainingSeconds--; updateCountdownDisplay();
    if (remainingSeconds <= 0) {
      clearInterval(countdownInterval); countdownActive = false; votingLocked = true; btnReset.disabled = false;
      setDoc(doc(db, "config", "voting"), { open: false, closedAt: new Date() });
      liveBadge.innerHTML = '<span class="dot"></span> CLOSED'; liveBadge.classList.add('closed');
      countdownLabel.textContent = 'VOTING CLOSED'; countdownLabel.classList.add('urgent');
      setTimeout(() => triggerWinnerReveal(), 1500);
    }
  }, 1000);
}

function resetCountdown() {
  clearInterval(countdownInterval); countdownActive = false; votingLocked = false; remainingSeconds = COUNTDOWN_DURATION;
  updateCountdownDisplay(); countdownWaiting.style.display = 'block';
  countdownLabel.textContent = 'Voting Countdown'; countdownLabel.classList.remove('urgent');
  btnStart.disabled = false; btnReset.disabled = true;
  liveBadge.innerHTML = '<span class="dot"></span> LIVE'; liveBadge.classList.remove('closed');
  setDoc(doc(db, "config", "voting"), { open: true, startedAt: new Date() });

  gsap.to('#winnerOverlay', { opacity: 0, duration: 0.8, onComplete: () => {
    document.getElementById('winnerOverlay').classList.remove('active');
  }});
}

btnStart.addEventListener('click', startCountdown);
btnReset.addEventListener('click', resetCountdown);

/* 🌟 PHYSICS CONFETTI CANNON 🌟 */
function fireConfettiCannons() {
  const duration = 5000;
  const end = Date.now() + duration;
  const colors = ['#fce373', '#1aa3ff', '#ff4d4d', '#ffffff'];

  (function frame() {
    // Left Cannon
    confetti({
      particleCount: 8, angle: 60, spread: 55, origin: { x: 0, y: 1 },
      colors: colors, zIndex: 1000
    });
    // Right Cannon
    confetti({
      particleCount: 8, angle: 120, spread: 55, origin: { x: 1, y: 1 },
      colors: colors, zIndex: 1000
    });

    if (Date.now() < end) {
      requestAnimationFrame(frame);
    }
  }());
}

/* WINNER REVEAL SEQUENCE */
function triggerWinnerReveal() {
  const sorted = [...participants].sort((a, b) => (latestCounts[b.id] || 0) - (latestCounts[a.id] || 0));
  const topVotes = latestCounts[sorted[0].id] || 0;
  const winners = sorted.filter(p => (latestCounts[p.id] || 0) === topVotes);
  const winnerPercentage = latestTotalVotes > 0 ? Math.round((topVotes / latestTotalVotes) * 100) : 0;

  const overlay = document.getElementById('winnerOverlay');
  const suspenseText = document.getElementById('winnerSuspense');
  const profilesContainer = document.getElementById('winnerProfiles');
  const badgeText = document.getElementById('winnerBadge');
  const miniScoreboard = document.getElementById('miniScoreboard');

  if (winners.length > 1) {
    suspenseText.textContent = "And the winners are...";
    badgeText.innerHTML = `🏆 PechaKucha 2026 Co-Champions (${winners.length})`;
  } else {
    suspenseText.textContent = "And the winner is...";
    badgeText.innerHTML = "🏆 PechaKucha 2026 Champion";
  }

  profilesContainer.innerHTML = winners.map(w => `
    <div class="winner-profile">
      <div class="winner-photo-wrap"><img src="${w.image}" alt="${w.name}"></div>
      <div class="winner-name">${w.name}</div>
    </div>
  `).join('');

  document.getElementById('winnerVotes').textContent = topVotes;
  document.getElementById('winnerPct').textContent = winnerPercentage + '%';

  const miniHTML = sorted.slice(0, 5).map((p, i) => `
    <div class="mini-row" data-rank="${i+1}">
      <div class="mini-rank">#${i+1}</div>
      <img class="mini-photo" src="${p.image}">
      <div class="mini-name">${p.name}</div>
      <div class="mini-score">${latestCounts[p.id] || 0}</div>
    </div>
  `).join('');
  
  miniScoreboard.innerHTML = `<div class="mini-header">Final Standings</div>${miniHTML}`;
  
  overlay.classList.add('active');

  const tl = gsap.timeline();
  tl.to(overlay, { opacity: 1, duration: 1.5, ease: "power2.inOut" });
  tl.to(suspenseText, { opacity: 1, duration: 0.8, ease: "power2.out" }, "+=0.5");
  tl.to({}, { duration: 2.5 }); 
  tl.to(suspenseText, { opacity: 0, duration: 0.4 });
  tl.set(profilesContainer, { opacity: 1 });
  
  // Confetti Blast exactly as photos explode
  tl.call(fireConfettiCannons);

  tl.fromTo('.winner-photo-wrap', { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 1, ease: "elastic.out(1, 0.5)", stagger: 0.2 });
  tl.fromTo('.winner-name', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.8, ease: "power2.out", stagger: 0.2 }, "-=0.6");
  tl.to('#winnerStats', { opacity: 1, duration: 0.6, ease: "power2.out" }, "-=0.2");
  tl.to(badgeText, { opacity: 1, duration: 0.6, ease: "power2.out" }, "-=0.1");
  tl.fromTo(miniScoreboard, { x: 50, opacity: 0 }, { x: 0, opacity: 1, duration: 0.8, ease: "power2.out" }, "-=0.2");
}

/* AUTH + REAL-TIME */
const totalVotesEl = document.getElementById('totalVotes');
const leadMarginEl = document.getElementById('leadMargin');

document.getElementById('loginBtn').addEventListener('click', () => signInWithPopup(auth, provider));

onAuthStateChanged(auth, (user) => {
  if (user) {
    document.getElementById('authGuard').style.display = 'none';
    document.getElementById('resultsBoard').style.display = 'block';
    document.getElementById('adminControls').style.display = 'flex';

    participants.forEach((p, i) => {
      gsap.to(`#row-${p.id}`, { opacity: i < 5 ? 1 : 0, delay: i * 0.12, duration: 0.6, ease: "power2.out" });
    });

    let isFirstSnapshot = true;
    let prevTotal = 0;

    onSnapshot(collection(db, "votes"), (snapshot) => {
      const totalVotes = snapshot.size;
      latestTotalVotes = totalVotes;
      const counts = {};
      participants.forEach(p => counts[p.id] = 0);

      snapshot.forEach(d => {
        const data = d.data();
        if (counts[data.participantId] !== undefined) counts[data.participantId]++;
      });
      latestCounts = { ...counts };
      
      isFirstSnapshot = false;
      prevTotal = totalVotes;

      const sorted = [...participants].sort((a, b) => counts[b.id] - counts[a.id]);

      if (sorted.length >= 2) {
        const margin = counts[sorted[0].id] - counts[sorted[1].id];
        leadMarginEl.textContent = margin > 0 ? `+${margin}` : '—';
      }
      animateCount(totalVotesEl, totalVotes);

      sorted.forEach((p, i) => {
        const row = document.getElementById(`row-${p.id}`);
        const fill = document.getElementById(`fill-${p.id}`);
        const countEl = document.getElementById(`count-${p.id}`);
        const pctEl = document.getElementById(`pct-${p.id}`);
        const rankEl = document.getElementById(`rank-${p.id}`);
        
        const isLeader = (i === 0);

        gsap.to(row, { 
          top: i * ROW_HEIGHT, 
          scale: isLeader ? 1.04 : 1,
          x: isLeader ? 15 : 0,
          opacity: i < 5 ? 1 : 0,
          duration: 0.9, 
          ease: "power3.inOut" 
        });

        if (isLeader) {
          row.classList.add('is-leader-row');
        } else {
          row.classList.remove('is-leader-row');
        }

        row.dataset.rank = i + 1;
        rankEl.textContent = i + 1;

        const pct = totalVotes === 0 ? 0 : (counts[p.id] / totalVotes) * 100;
        gsap.to(fill, { width: `${Math.max(pct, counts[p.id] > 0 ? 2 : 0)}%`, duration: 0.8, ease: "power2.out" });
        animateCount(countEl, counts[p.id]);
        pctEl.textContent = totalVotes === 0 ? '0%' : Math.round(pct) + '%';
      });
    }, (error) => {
      alert("Access Denied. Admin only."); console.error(error);
    });
  }
});
</script>
</body>
</html>
